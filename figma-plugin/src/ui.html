<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: var(--figma-color-bg, #ffffff); --text: var(--figma-color-text, #333333); --grey: var(--figma-color-border, #e5e5e5); --blue: #18a0fb; --blue-hover: #0c8ce9; --green: #1bc47d; }
    body { font-family: Inter, sans-serif; font-size: 12px; margin: 0; padding: 16px; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }

    /* Controls */
    .controls { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--grey); flex-shrink: 0; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    label { font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .sub-label { font-size: 10px; color: #888; margin-left: auto; }

    input[type="number"], select { border: 1px solid var(--grey); border-radius: 4px; padding: 6px; width: 80px; background: transparent; color: var(--text); }
    input[type="range"] { flex: 1; margin-left: 10px; accent-color: var(--blue); }
    input[type="checkbox"] { width: 14px; height: 14px; margin: 0; accent-color: var(--blue); }

    .lossy-controls { padding-left: 20px; transition: opacity 0.3s; }
    .disabled-area { opacity: 0.4; pointer-events: none; }

    /* Buttons */
    button { background: var(--blue); color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 11px; text-transform: uppercase; transition: background 0.2s; }
    button:hover { background: var(--blue-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; background: #999; }

    button.secondary { background: transparent; border: 1px solid var(--grey); color: var(--text); text-transform: none; font-size: 12px; }
    button.secondary:hover { background: rgba(128,128,128,.1); }

    /* List */
    #group-list { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; padding-right: 4px; }
    .group-item { border: 1px solid var(--grey); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .group-header { padding: 10px; background: rgba(128,128,128,.06); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .group-title { font-weight: 700; font-size: 13px; }
    .group-meta { color: #888; font-size: 10px; margin-top: 2px; }
    .group-content { padding: 10px; display: none; border-top: 1px solid var(--grey); }
    .group-content.open { display: block; }
    .action-row { display: flex; gap: 8px; }

    /* Status Badge */
    .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(128,128,128,.15); color: #777; margin-left: 8px; display: none; }
    .status-badge.done { display: inline-block; background: #dff0d8; color: #3c763d; }
    .status-badge.loading { display: inline-block; background: #d9edf7; color: #31708f; }

    /* Preview */
    .preview-area { display: flex; flex-direction: column; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--grey); }
    .preview-img { max-width: 100%; height: auto; margin-bottom: 10px; border: 1px solid var(--grey); background: repeating-conic-gradient(#eee 0% 25%, transparent 0% 50%) 50% / 20px 20px; }

    #status { flex-shrink: 0; font-size: 10px; color: #888; padding: 4px 0 8px; min-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #footer { flex-shrink: 0; padding-top: 10px; border-top: 1px solid var(--grey); display: flex; flex-direction: column; gap: 8px; }
  </style>

  <!-- Единственный движок кодирования — gifski (gifski-wasm) на сайте hallizar.ru.
       Сайт открывается в iframe этого UI (см. networkAccess в manifest.json). -->
</head>
<body>

  <div class="controls">
    <div class="row">
      <label>Frame Delay (ms)</label>
      <input type="number" id="delay" value="2500" step="100">
    </div>

    <div class="row">
      <label>Resolution Scale</label>
      <select id="scale">
        <option value="1">1x (Original)</option>
        <option value="2">2x (Retina)</option>
        <option value="0.5">0.5x</option>
      </select>
    </div>

    <div class="row lossy-controls" id="quality-row">
      <label>Quality <span class="sub-label">gifski: 1 (низкое) - 100 (лучшее)</span></label>
      <div style="display:flex; align-items:center; width: 60%">
        <input type="range" id="quality" min="1" max="100" value="90">
        <span id="quality-val" style="width: 24px; text-align: right; margin-left: 5px; font-weight:bold;">90</span>
      </div>
    </div>

    <button id="scan-btn" class="secondary">🔄 Scan / Refresh Selection</button>
  </div>

  <div id="group-list">
    <div style="text-align:center; color:#999; margin-top: 40px;">
      Select frames and click Scan.
    </div>
  </div>

  <div id="status">Готов к работе.</div>

  <div id="footer">
    <button id="generate-all" disabled style="background: #2c3e50;">▶ Generate All GIFs</button>
    <button id="download-all" disabled>Download ZIP</button>
  </div>

  <script src="ui.js"></script>
</body>
</html>
