<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 14px;
    font: 12px/1.45 Inter, system-ui, sans-serif;
    background: var(--figma-color-bg, #fff);
    color: var(--figma-color-text, #1e1e1e);
  }
  h1 { font-size: 14px; margin: 0 0 4px; }
  .muted { color: var(--figma-color-text-secondary, #888); font-size: 11px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  label { min-width: 76px; color: var(--figma-color-text-secondary, #666); }
  input[type="number"] {
    width: 72px; padding: 5px 7px; border-radius: 5px;
    border: 1px solid var(--figma-color-border, #d9d9d9);
    background: var(--figma-color-bg-secondary, #f5f5f5);
    color: inherit; font: inherit;
  }
  button, .btnlike {
    appearance: none; border: 0; border-radius: 6px; cursor: pointer;
    padding: 8px 12px; font: inherit; font-weight: 600;
    background: var(--figma-color-bg-brand, #0d99ff); color: #fff;
    text-decoration: none; display: inline-block;
  }
  button.secondary { background: var(--figma-color-bg-secondary, #eee); color: inherit; }
  button.danger { background: transparent; color: var(--figma-color-text-danger, #d32); font-weight: 500; }
  button:disabled { opacity: .45; cursor: default; }
  #status { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--figma-color-bg-secondary, #f2f2f2); min-height: 16px; }
  #status[data-kind="warn"] { background: #fff7e0; color: #8a5b00; }
  #status[data-kind="error"] { background: #ffe9e9; color: #b3261e; }
  #status[data-kind="ok"] { background: #e6f7ea; color: #1a7431; }
  #progress-wrap { display: none; height: 4px; border-radius: 2px; background: var(--figma-color-border, #ddd); margin-top: 8px; overflow: hidden; }
  #progress-bar { height: 100%; width: 0; background: var(--figma-color-bg-brand, #0d99ff); transition: width .15s; }
  .preview-box {
    margin-top: 12px; border: 1px dashed var(--figma-color-border, #ccc); border-radius: 8px;
    min-height: 120px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: repeating-conic-gradient(#e8e8e8 0 25%, #fff 0 50%) 0 0 / 16px 16px;
  }
  canvas, img#preview-img { max-width: 100%; max-height: 220px; image-rendering: pixelated; display: block; margin: auto; }
  img#preview-img { display: none; }
  #info { margin-top: 6px; font-size: 11px; color: var(--figma-color-text-secondary, #777); }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #download, #insert { display: none; }
  #cancel { display: none; }
</style>
</head>
<body>
  <h1>GIF Studio — экспорт в GIF</h1>
  <div class="muted">Выделите кадры анимации (слои/фреймы) или один фрейм-контейнер с кадрами-детьми.</div>
  <div id="selection-count">Ничего не выделено</div>

  <div class="row"><label for="delay">Задержка, мс</label><input id="delay" type="number" value="100" min="10" max="30000" step="10" /><div id="fps-row">≈ 10 fps</div></div>
  <div class="row"><label for="scale">Масштаб</label><input id="scale" type="number" value="1" min="0.1" max="4" step="0.25" /></div>
  <div class="row"><label for="quality">Качество</label><input id="quality" type="number" value="90" min="1" max="100" step="5" /></div>

  <div class="actions">
    <button id="scan">Прочитать выделение</button>
    <button id="encode" disabled>Собрать GIF</button>
    <button id="cancel" class="danger">Отменить</button>
  </div>

  <div id="status">Готов к работе.</div>
  <div id="progress-wrap"><div id="progress-bar"></div></div>

  <div class="preview-box">
    <canvas id="preview"></canvas>
    <img id="preview-img" alt="" />
  </div>
  <div id="info"></div>

  <div class="actions">
    <a id="download" class="btnlike" href="#" download="animation.gif">Скачать GIF</a>
    <button id="insert" class="secondary">Вставить в документ</button>
  </div>

  <script src="ui.js"></script>
</body>
</html>
